name: Build and Release Events Module

on:
  push:
    branches:
      - master
    paths:
      - 'Events Module/**'
      - '.github/workflows/build-events-module.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore "Community Module Pack.sln"

      - name: Build Events Module
        run: msbuild "Events Module/Events Module.csproj" /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Verify Traditional Chinese resource
        shell: pwsh
        run: |
          $resource = Get-ChildItem -Path "Events Module/bin/Release" -Recurse -Filter "Events Module.resources.dll" |
            Where-Object { $_.FullName -match '[\\/]zh-TW[\\/]' } |
            Select-Object -First 1

          if (-not $resource) {
            Write-Error "找不到 zh-TW/Events Module.resources.dll，繁中資源未正確編譯。"
            exit 1
          }

          Write-Host "繁中資源驗證成功：$($resource.FullName)"

      - name: Read module version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content "Events Module/manifest.json" -Raw | ConvertFrom-Json
          $version = $manifest.version
          if (-not $version) {
            Write-Error "manifest.json 沒有 version。"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Events Module version: $version"

      - name: Locate BHM package
        id: package
        shell: pwsh
        run: |
          $bhm = Get-ChildItem -Path "Events Module/bin/Release" -Recurse -Filter "*.bhm" |
            Select-Object -First 1

          if (-not $bhm) {
            Write-Error "找不到建置產生的 .bhm。"
            exit 1
          }

          "path=$($bhm.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "BHM: $($bhm.FullName)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bh.general.events-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BHM_PATH: ${{ steps.package.outputs.path }}
        run: |
          $tag = "events-module-v$env:VERSION"
          $title = "Events and Metas Observer v$env:VERSION"

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag 已存在，更新 .bhm asset。"
            gh release upload $tag "$env:BHM_PATH" --clobber --repo "${{ github.repository }}"
          } else {
            Write-Host "建立 Release $tag。"
            gh release create $tag "$env:BHM_PATH" --target "${{ github.sha }}" --title $title --generate-notes --repo "${{ github.repository }}"
          }
